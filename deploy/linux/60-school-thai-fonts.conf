<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  ปพ.5 template uses "TH SarabunPSK" and "Cordia New". Cordia New is a Microsoft font that
  Linux does not have: render it with TH SarabunPSK (bundled in deploy/linux/fonts) instead of a
  random fallback, so PDFs from LibreOffice keep Thai shaping and similar line heights.
  Installed to /etc/fonts/conf.d/ by deploy/linux/setup.sh.
-->
<fontconfig>
  <alias binding="same">
    <family>Cordia New</family>
    <prefer><family>TH SarabunPSK</family></prefer>
  </alias>
  <alias binding="same">
    <family>TH Sarabun New</family>
    <prefer><family>TH SarabunPSK</family></prefer>
  </alias>
  <alias binding="same">
    <family>CordiaUPC</family>
    <prefer><family>TH SarabunPSK</family></prefer>
  </alias>
  <alias binding="same">
    <family>Angsana New</family>
    <prefer><family>TH SarabunPSK</family></prefer>
  </alias>
  <alias binding="same">
    <family>Tahoma</family>
    <prefer><family>Loma</family><family>TH SarabunPSK</family></prefer>
  </alias>
</fontconfig>
